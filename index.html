<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f5f7f4" />
  <title>Stockroom — Inventory Management</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <a class="brand" href="#dashboard" aria-label="Stockroom home">
        <span class="brand-mark"><span></span><span></span><span></span></span>
        <span class="brand-name">stockroom<span>•</span></span>
      </a>

      <div class="workspace-label">WORKSPACE</div>

      <nav class="main-nav" aria-label="Main navigation">
        <button class="nav-link active" data-page="dashboard"><span
            class="nav-icon">▦</span><span>Dashboard</span></button>
        <button class="nav-link" data-page="products"><span class="nav-icon">◇</span><span>Products</span><span
            class="nav-count" id="productNavCount">0</span></button>
        <button class="nav-link" data-page="stock"><span class="nav-icon">⇅</span><span>Stock management</span></button>

        <div class="nav-divider"></div>
        <div class="workspace-label nav-section-label">OPERATIONS</div>

        <button class="nav-link" data-page="suppliers"><span class="nav-icon">♧</span><span>Suppliers</span></button>
        <button class="nav-link" data-page="purchase"><span class="nav-icon">↙</span><span>Purchase</span></button>
        <button class="nav-link" data-page="sales"><span class="nav-icon">↗</span><span>Sales</span></button>

        <div class="nav-divider"></div>
        <div class="workspace-label nav-section-label">INSIGHTS</div>

        <button class="nav-link" data-page="reports"><span class="nav-icon">▤</span><span>Reports</span></button>
      </nav>

      <div class="sidebar-bottom">
        <div class="help-card">
          <div class="help-icon">✳</div>
          <strong>Need a hand?</strong>
          <p>Your stock, all in one place. Keep everything moving.</p>
          <button class="help-link" id="helpButton">Quick guide <span>↗</span></button>
        </div>

        <div class="profile-row">
          <div class="avatar">AM</div>
          <div class="profile-info">
            <strong>Abdullah Mahmud</strong>
            <span>Store administrator</span>
          </div>
          <button class="icon-button profile-menu" id="profileButton" aria-label="Profile options">···</button>
        </div>
      </div>
    </aside>

    <main class="main-area">
      <header class="topbar">
        <div class="topbar-left">
          <button class="icon-button mobile-menu" id="mobileMenu" aria-label="Open menu">☰</button>
          <div class="breadcrumb">
            <span>Workspace</span>
            <span class="crumb-slash">/</span>
            <strong id="breadcrumbCurrent">Dashboard</strong>
          </div>
        </div>

        <div class="topbar-actions">
          <div class="today-chip">
            <span class="live-dot"></span>
            <span id="todayDate">Today</span>
          </div>
          <button class="icon-button notification-button" id="notificationButton"
            aria-label="Notifications">♧<i></i></button>
          <div class="topbar-avatar">AM</div>
        </div>
      </header>

      <section class="page-content" id="pageContent" aria-live="polite"></section>

      <footer class="page-footer">
        <span>© 2026 Stockroom</span>
        <span>Good inventory. Better decisions.</span>
      </footer>
    </main>
  </div>

  <div class="modal-backdrop" id="modalBackdrop" aria-hidden="true">
    <section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="modal-header">
        <div>
          <span class="eyebrow" id="modalEyebrow">WORKSPACE</span>
          <h2 id="modalTitle">Add item</h2>
        </div>
        <button class="icon-button modal-close" id="modalClose" aria-label="Close dialog">×</button>
      </div>

      <form id="modalForm">
        <div class="modal-body" id="modalBody"></div>
        <div class="modal-footer">
          <button class="button button-quiet" type="button" id="modalCancel">Cancel</button>
          <button class="button button-primary" type="submit" id="modalSubmit">Save changes <span>↗</span></button>
        </div>
      </form>
    </section>
  </div>

  <div class="toast-region" id="toastRegion" aria-live="polite"></div>

  <script src="script.js"></script>
</body>

</html>
